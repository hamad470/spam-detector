name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check src app tests
      - run: ruff format --check src app tests
      - name: Fetch the published model for the API tests
        run: |
          python -c "from huggingface_hub import snapshot_download; \
          snapshot_download('hamad470/sms-scam-distilroberta', local_dir='models/onnx', allow_patterns=['model.onnx', 'tokenizer.json'])" \
          || echo "::warning::model not on the Hub yet, API tests will be skipped"
      - run: pytest -q -rs

  deploy:
    # Mirrors the serving files to a Hugging Face Docker Space, which rebuilds the image.
    # Needs the HF_TOKEN secret (write token) and the HF_SPACE variable (e.g. "user/spam-detector").
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Hugging Face is not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "::warning::HF_TOKEN secret or HF_SPACE variable not set, skipping deploy"
      - name: Push serving files to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import create_repo; import os; create_repo(os.environ['HF_SPACE'], repo_type='space', space_sdk='docker', exist_ok=True, token=os.environ['HF_TOKEN'])"
          # Spaces read their config from YAML front matter in README.md; keep it out of the GitHub README
          { cat .github/hf-space-header.md; cat README.md; } > README.tmp && mv README.tmp README.md
          rm -rf data notebooks tests reports docs .github
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
