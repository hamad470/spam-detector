<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="System architecture: offline, three SMS and three email datasets are repaired, scrubbed of corpus fingerprints, de-duplicated, grouped into campaigns and split, with 2023-2025 phishing held out; three model types are trained and evaluated; the fine-tuned DistilRoBERTa is calibrated and exported to int8 ONNX. Online, a static web page downloads that model once and runs it in the visitor's browser with ONNX Runtime Web, normalising the text, classifying it and explaining the decision by occlusion." font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="560" rx="14" fill="#fcfcfb"/>

  <!-- lanes -->
  <rect x="16" y="16" width="1088" height="292" rx="10" fill="#f4f3ef"/>
  <text x="32" y="40" font-size="13" font-weight="600" fill="#0b0b0b">OFFLINE  ·  reproducible CLI (laptop CPU; transformers on a free Colab GPU)</text>
  <rect x="16" y="356" width="1088" height="188" rx="10" fill="#eef4fc"/>
  <text x="32" y="380" font-size="13" font-weight="600" fill="#0b0b0b">ONLINE  ·  in the visitor's browser (static Hugging Face Space, free)</text>

  <!-- sources -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="32" y="62" width="160" height="80" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="112" y="83" text-anchor="middle" font-weight="600">SMS · 3 datasets</text>
    <text x="112" y="102" text-anchor="middle" fill="#52514e">UCI 2011, Mendeley 2022,</text>
    <text x="112" y="119" text-anchor="middle" fill="#52514e">ExAIS (Nigeria)</text>
    <rect x="32" y="156" width="160" height="80" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="112" y="177" text-anchor="middle" font-weight="600">Email · 3 datasets</text>
    <text x="112" y="196" text-anchor="middle" fill="#52514e">Enron, SpamAssassin,</text>
    <text x="112" y="213" text-anchor="middle" fill="#52514e">Nazario phishing 2005-25</text>
  </g>

  <!-- audit / split -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="236" y="62" width="222" height="174" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="347" y="84" text-anchor="middle" font-weight="600">build_dataset</text>
    <text x="250" y="108" fill="#52514e">1  repair encoding, undo Enron</text>
    <text x="250" y="124" fill="#52514e">    packaging</text>
    <text x="250" y="146" fill="#52514e">2  scrub corpus fingerprints</text>
    <text x="250" y="168" fill="#52514e">3  exact + MinHash de-dup</text>
    <text x="250" y="190" fill="#52514e">4  split by campaign; hold out</text>
    <text x="250" y="206" fill="#52514e">    2023-25 phishing as "future"</text>
    <text x="347" y="228" text-anchor="middle" font-size="11" fill="#2a78d6">49k unique messages</text>
  </g>
  <line x1="192" y1="102" x2="232" y2="130" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="192" y1="196" x2="232" y2="168" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- training -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="504" y="62" width="216" height="174" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="612" y="84" text-anchor="middle" font-weight="600">model ladder</text>
    <text x="520" y="110" fill="#52514e">Naive Bayes (original)</text>
    <text x="520" y="132" fill="#52514e">TF-IDF word+char + LR</text>
    <text x="520" y="154" fill="#0b0b0b" font-weight="600">DistilRoBERTa × 3 seeds</text>
    <text x="520" y="172" fill="#52514e">Colab T4 GPU, 3 epochs</text>
    <text x="520" y="194" fill="#52514e">+ SMS-only, email-only runs</text>
    <text x="612" y="224" text-anchor="middle" font-size="11" fill="#52514e">channel prefix · attack augmentation</text>
  </g>
  <line x1="458" y1="149" x2="500" y2="149" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="479" y="140" text-anchor="middle" font-size="11" fill="#52514e">train</text>

  <!-- evaluation -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="770" y="62" width="318" height="96" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="929" y="84" text-anchor="middle" font-weight="600">evaluate</text>
    <text x="786" y="108" fill="#52514e">per channel and source · 95% CIs · 3 seeds</text>
    <text x="786" y="128" fill="#52514e">2023-25 phishing · no-hook scams · transfer</text>
    <text x="786" y="148" fill="#52514e">shortcut + leakage audits · 5 attacks</text>
  </g>
  <line x1="720" y1="110" x2="766" y2="110" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="743" y="101" text-anchor="middle" font-size="11" fill="#52514e">score</text>
  <path d="M347,236 L347,266 L1096,266 L1096,110 L1092,110" fill="none" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="600" y="284" text-anchor="middle" font-size="11" fill="#52514e">"future" set: phishing from 2023-25, never trained on in the evaluated runs</text>

  <!-- export -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="770" y="178" width="318" height="58" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="929" y="200" text-anchor="middle" font-weight="600">final run → temperature → ONNX → int8</text>
    <text x="929" y="220" text-anchor="middle" fill="#52514e">PyTorch 328 MB → int8 ONNX 82.5 MB</text>
  </g>
  <path d="M720,198 L766,205" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="743" y="192" text-anchor="middle" font-size="11" fill="#2a78d6">final</text>

  <!-- boundary -->
  <line x1="16" y1="332" x2="1104" y2="332" stroke="#9c9b94" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="32" y="326" font-size="11" fill="#52514e">GitHub Actions: lint, Python tests, JS-vs-Python parity tests → publish static Space</text>
  <line x1="929" y1="236" x2="929" y2="428" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrb)"/>
  <rect x="940" y="318" width="152" height="28" rx="6" fill="#fcfcfb" stroke="#2a78d6"/>
  <text x="1016" y="336" text-anchor="middle" font-size="11" fill="#2a78d6">downloaded once, cached</text>

  <!-- online request path -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="32" y="400" width="140" height="56" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="102" y="423" text-anchor="middle" font-weight="600">visitor</text>
    <text x="102" y="441" text-anchor="middle" fill="#52514e">pastes SMS or email</text>

    <rect x="232" y="400" width="150" height="56" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="307" y="423" text-anchor="middle" font-weight="600">web page</text>
    <text x="307" y="441" text-anchor="middle" fill="#52514e">static HTML + JS</text>

    <rect x="442" y="400" width="170" height="56" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="527" y="423" text-anchor="middle" font-weight="600">prepare() in JS</text>
    <text x="527" y="441" text-anchor="middle" fill="#52514e">same rules as Python</text>

    <rect x="672" y="400" width="170" height="56" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="757" y="423" text-anchor="middle" font-weight="600">tokenizers.js</text>
    <text x="757" y="441" text-anchor="middle" fill="#52514e">96 SMS / 256 email tokens</text>

    <rect x="880" y="400" width="208" height="56" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="984" y="423" text-anchor="middle" font-weight="600">ONNX Runtime Web</text>
    <text x="984" y="441" text-anchor="middle" fill="#52514e">WebAssembly · ÷ T · softmax</text>

    <rect x="442" y="478" width="400" height="50" rx="8" fill="#fff" stroke="#c9c8c1"/>
    <text x="642" y="499" text-anchor="middle" font-weight="600">occlusion explainer</text>
    <text x="642" y="516" text-anchor="middle" fill="#52514e">drop each word, re-score all variants in one batch, Δ log-odds</text>
  </g>
  <line x1="172" y1="420" x2="228" y2="420" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#52514e">text</text>
  <line x1="382" y1="428" x2="438" y2="428" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="612" y1="428" x2="668" y2="428" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="842" y1="428" x2="876" y2="428" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M984,456 L984,503 L846,503" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="992" y="486" font-size="11" fill="#52514e">p(scam)</text>
  <path d="M442,503 L102,503 L102,460" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="272" y="495" text-anchor="middle" font-size="11" fill="#52514e">label · probabilities · evidence words</text>
</svg>
