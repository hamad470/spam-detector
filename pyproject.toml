[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-detector"
version = "3.0.0"
description = "Legit / spam / phishing classifier for SMS and email: data and shortcut audits, campaign-aware evaluation, in-browser ONNX demo"
authors = [{ name = "Hamad Ur Rehman" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime pins live in requirements*.txt so the Docker image and CI install exactly the same versions

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the app/ package, which isn't installed

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# PROBES holds verbatim example messages; wrapping them would make them harder to read
"src/spam_detector/llm_compare.py" = ["E501"]
