[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-detector"
version = "2.0.0"
description = "Ham / spam / smishing SMS classifier with a leakage-aware evaluation, obfuscation robustness and an ONNX FastAPI service"
authors = [{ name = "Hamad Ur Rehman" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime pins live in requirements*.txt so the Docker image and CI install exactly the same versions

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the app/ package, which isn't installed

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
