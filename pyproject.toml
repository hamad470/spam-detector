[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-detector"
version = "1.0.0"
description = "SMS spam classifier (TF-IDF + chi-squared feature selection + Naive Bayes) served with FastAPI"
authors = [{ name = "Hamad Ur Rehman" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
